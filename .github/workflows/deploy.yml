name: Deploy Emya Wiki to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-wiki
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Upload to a fresh release dir, then swap the symlink so visitors never see a half-copied site
      - name: Upload and switch release
        env:
          HOST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          ROOT: /var/www/wiki.emya.tech
        run: |
          RELEASE="$ROOT/releases/$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh -p "$PORT" "$HOST" "mkdir -p '$RELEASE'"
          rsync -az --delete -e "ssh -p $PORT" docs/.vitepress/dist/ "$HOST:$RELEASE/"
          ssh -p "$PORT" "$HOST" "ln -sfn '$RELEASE' '$ROOT/current' && cd '$ROOT/releases' && ls -1t | tail -n +6 | xargs -r rm -rf"
