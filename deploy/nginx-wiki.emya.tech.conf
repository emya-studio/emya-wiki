# /etc/nginx/sites-available/wiki.emya.tech
# Matches emya-tech production Ubuntu 24.04 setup

server {
    listen 80;
    listen [::]:80;
    server_name wiki.emya.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wiki.emya.tech;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/wiki.emya.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.emya.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/wiki.emya.tech/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # VitePress cleanUrls: /products/emya-pro -> /products/emya-pro.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # VitePress hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
